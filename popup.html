<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Arrow Seek</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="popup-header">
      <h1 id="title">Video Arrow Seek</h1>
      <label class="language-picker">
        <span class="visually-hidden" id="language-label">Language</span>
        <select id="language" aria-labelledby="language-label">
          <option value="en">English</option>
          <option value="zh">简体中文</option>
          <option value="zh-TW">繁體中文</option>
        </select>
      </label>
    </header>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <p class="intro" id="intro">Configure each platform independently</p>
    <label class="silent-toggle">
      <input id="silent-seek" type="checkbox">
      <span id="silent-label">Silent seeking (hide player controls until mouse movement)</span>
    </label>
    <label class="silent-toggle">
      <input id="silent-spacebar" type="checkbox">
      <span id="silent-spacebar-label">Hide player controls when toggling playback with Space</span>
    </label>
    <section class="bulk-panel" id="bulk-panel" aria-label="Bulk actions">
      <div class="bulk-seconds">
        <label for="bulk-seconds" id="bulk-seconds-label">Set skip seconds</label>
        <input id="bulk-seconds" type="number" min="1" max="600" step="1" value="10">
        <button id="apply-seconds" type="button" class="secondary">Apply to selected</button>
      </div>
      <div class="bulk-buttons">
        <button id="enable-selected" type="button" class="secondary">Enable selected</button>
        <button id="disable-selected" type="button" class="secondary">Disable selected</button>
      </div>
    </section>
    <button id="save-top" type="button">Save settings</button>
    <p class="save-hint" id="save-shortcut-hint">Shortcut: Ctrl+S / ⌘+S</p>
    <label class="select-all"><input id="select-all" type="checkbox"> <span id="select-all-label">Select all platforms</span></label>
    <div id="platforms" class="platforms"></div>
    <button id="save" type="button">Save settings</button>
    <p id="status" role="status" aria-live="polite">← Rewind / → Fast forward</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
